<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />

    <!-- SEO Meta Tags -->
    <title>Tushar Maru | Creative Studio &amp; Video Editor</title>
    <meta name="description" content="Tushar Maru — A sophisticated typography-first creative studio aesthetic. Videographer &amp; Editor based in Mumbai specializing in Celebrity BTS, Music Videos &amp; Commercials." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Tushar Maru" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tushar Maru | Videographer &amp; Video Editor" />
    <meta property="og:description" content="Bold editorial studio aesthetic portfolio for Tushar Maru, Videographer &amp; Editor." />
    <meta property="og:image" content="/glass_camera.png" />

    <!-- DNS prefetch & font preconnect -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://i.ytimg.com" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter + JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Tushar Maru",
      "jobTitle": "Videographer & Video Editor",
      "description": "Skilled videographer and editor with 2 years of experience in creating dynamic visual content in Mumbai.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Mumbai",
        "addressCountry": "India"
      },
      "knowsAbout": [
        "Videography",
        "Video Editing",
        "Adobe Premiere Pro",
        "After Effects",
        "Celebrity BTS Shoots",
        "Music Video Edits",
        "On-Floor Management"
      ]
    }
    </script>

    <style>
      html, body {
        background: #FFFFFF;
        color: #000000;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
