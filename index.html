<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0C0C0C" />

    <!-- SEO Meta Tags -->
    <title>Tushar Maru | Videographer &amp; Video Editor Portfolio</title>
    <meta name="description" content="Tushar Maru — Professional Videographer &amp; Video Editor based in Mumbai. Specializing in Celebrity BTS shoots, Live Music Events, Music Album edits &amp; Brand Commercials." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Tushar Maru" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tushar Maru | Videographer &amp; Video Editor" />
    <meta property="og:description" content="Videographer &amp; Editor based in Mumbai with 2+ years of experience in Adobe Premiere Pro &amp; After Effects." />
    <meta property="og:image" content="/glass_camera.png" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tushar Maru | Videographer &amp; Editor" />
    <meta name="twitter:description" content="Videographer &amp; Video Editor specializing in Celebrity BTS, Music Videos &amp; Commercial Edits." />
    <meta name="twitter:image" content="/glass_camera.png" />

    <!-- DNS prefetch & font preconnect -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://i.ytimg.com" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Creative Google Fonts Combination: Syne (Bold Display), Playfair Display (Serif Accent Italic), Kanit & Plus Jakarta Sans (Interface) -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Tushar Maru",
      "jobTitle": "Videographer & Video Editor",
      "description": "Skilled videographer and editor with 2 years of experience in creating dynamic visual content in Mumbai.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Mumbai",
        "addressCountry": "India"
      },
      "knowsAbout": [
        "Videography",
        "Video Editing",
        "Adobe Premiere Pro",
        "After Effects",
        "Celebrity BTS Shoots",
        "Music Video Edits",
        "On-Floor Management"
      ]
    }
    </script>

    <style>
      html, body { background: #0C0C0C; margin: 0; padding: 0; overflow-x: hidden; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
